[package]
name = "sudo-relay"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
host-probe = []

[[bin]]
name = "mcp-host-probe"
path = "security-lab/mcp-host-probe/server.rs"
required-features = ["host-probe"]

[dependencies]
anyhow = "1"
ciborium = "0.2"
ed25519-dalek = "2"
hex = "0.4"
libc = "0.2"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
rand = "0.8"
rmcp = { version = "0.15", features = ["transport-io"] }
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

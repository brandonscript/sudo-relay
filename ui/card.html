<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sudo-relay · Root approval</title>
<style>
:root{color-scheme:light dark}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:light-dark(#202123,#ececec);background:light-dark(#fff,#212121)}
#approval{--surface:light-dark(#f5f5f5,#2d2d2d);--line:light-dark(#e4e5e7,#424242);--muted:light-dark(#62666d,#b5b5b5);--primary:light-dark(#222,#ececec);--on-primary:light-dark(#fff,#212121);max-width:700px;margin:auto;padding:22px;box-sizing:border-box}
#approval *{box-sizing:border-box}
#approval header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
#approval h1{font-size:20px;font-weight:600;margin:0;flex:1}
#approval .muted{color:var(--muted);font-size:13px}
#approval p{margin:0}
#approval .command{background:var(--surface);border-radius:12px;padding:16px;margin-top:8px}
#approval pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace}
#approval .label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
#approval .reason,#approval details{margin-top:16px;font-size:13px}
#approval #command-label{margin-top:18px}
#approval #machine{overflow-wrap:anywhere}
#approval summary{min-height:36px;align-content:center}
#approval details pre{font-size:12px;margin-top:8px}
#approval .output-choice{display:flex;gap:10px;align-items:center;min-height:44px;margin-top:12px;font-size:14px}
#approval .output-choice input{width:20px;height:20px;flex:none}
#approval .confirmation{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;background:var(--surface);border-radius:12px;margin-top:18px}
#approval .challenge{font-size:14px;font-weight:500;display:block}
#approval .challenge strong{font:600 19px ui-monospace,monospace;letter-spacing:.1em;margin-left:5px}
#approval .digits{position:relative;display:flex;flex:none;background:light-dark(#fff,#212121);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#approval .digits:focus-within{outline:2px solid var(--primary);outline-offset:3px}
#approval .digits span{width:42px;height:48px;display:grid;place-items:center;font:500 22px ui-monospace,monospace;pointer-events:none}
#approval .digits span+span{border-left:1px solid var(--line)}
#approval .digits input{position:absolute;inset:0;width:100%;height:100%;font-size:16px;border:0;opacity:0;caret-color:transparent}
#approval .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
#approval button{font:inherit;font-weight:500;font-size:14px;min-height:44px;padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit}
#approval #approve{background:var(--primary);color:var(--on-primary);border-color:var(--primary);flex:1}
#approval button:disabled{opacity:.4;cursor:not-allowed}
#approval #result{font-size:12px;color:var(--muted);margin-top:12px;overflow-wrap:anywhere}
#approval #request-details{color:inherit}
#approval [hidden]{display:none}
@media(max-width:360px){#approval{padding:16px}#approval .confirmation{padding:12px;gap:10px}#approval .digits span{width:36px}}
</style>
<main id="approval">
<header><h1>Root approval</h1><span class="muted" id="expiry">Waiting for request</span></header>
<p class="muted" id="machine"></p>
<p class="reason"><span class="label">Agent’s explanation</span><span id="reason"></span></p>
<span class="label" id="command-label">Command · run as root</span>
<div class="command"><pre><code id="command"></code></pre></div>
<details><summary>Execution details</summary><pre id="request-details"></pre></details>
<form id="confirmation-form">
<label class="output-choice"><input id="share-output" type="checkbox" aria-describedby="output-needed">Share command output with the agent</label>
<p class="muted" id="output-needed" hidden>The agent says output is needed to continue this task. You can still leave sharing off or deny the request.</p>
<div class="confirmation">
<label for="number"><span class="challenge">Type <strong id="challenge">—</strong> to confirm</span></label>
<div class="digits"><span id="digit-first" aria-hidden="true">·</span><span id="digit-second" aria-hidden="true">·</span><input id="number" type="text" inputmode="numeric" pattern="[0-9]{2}" maxlength="2" autocomplete="off" required aria-label="Two-digit confirmation code"></div>
</div>
<div class="actions"><button id="approve" type="submit" disabled>Approve once</button><button id="cancel" type="button" disabled>Deny</button></div>
</form>
<p id="result" role="status" aria-live="polite">Waiting for a trusted host adapter.</p>
</main>
<!-- APPROVAL_SCRIPT -->
</html>

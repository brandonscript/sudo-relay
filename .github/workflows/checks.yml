name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  approval-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: ui
      - run: npm ci && npm run check
        working-directory: security-lab/approval-host
      - run: npx playwright install --with-deps chromium
        working-directory: security-lab/approval-host
      - run: npm test
        working-directory: security-lab/approval-host
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --features host-probe -- -D warnings
      - run: cargo test --locked --features host-probe
      - name: Check isolated Touch ID experiment without hardware authentication
        if: runner.os == 'macOS'
        run: swift test -Xswiftc -warnings-as-errors
        working-directory: security-lab/touch-id
      - run: npm ci && npm run check && npm test && npm run build
        working-directory: ui
      - run: cargo build --locked --features host-probe --bin mcp-host-probe
      - run: python3 security-lab/mcp-host-probe/check.py
      - run: python3 security-lab/mcp-host-probe/package.py
      - run: node --import ./ui/node_modules/tsx/dist/loader.mjs scripts/integration.mts --boundary-only
      - run: node --import ./ui/node_modules/tsx/dist/loader.mjs scripts/integration.mts
  privileged:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --test privileged --no-run --message-format=json > /tmp/privileged-test-build.json
      - name: Run only the built root test executable
        run: |
          python3 - <<'PYTEST'
          import json, subprocess
          executables = []
          for line in open('/tmp/privileged-test-build.json'):
              item = json.loads(line)
              if item.get('executable') and item.get('target', {}).get('name') == 'privileged':
                  executables.append(item['executable'])
          assert len(executables) == 1, executables
          subprocess.run(['sudo', executables[0], '--ignored', '--test-threads=1'], check=True)
          PYTEST

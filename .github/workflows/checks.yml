name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: npm ci && npm run check && npm test && npm run build
        working-directory: ui
      - run: node --import ./ui/node_modules/tsx/dist/loader.mjs scripts/integration.mts
  privileged:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --test privileged --no-run --message-format=json > /tmp/privileged-test-build.json
      - name: Run only the built root test executable
        run: |
          python3 - <<'PYTEST'
          import json, subprocess
          executables = []
          for line in open('/tmp/privileged-test-build.json'):
              item = json.loads(line)
              if item.get('executable') and item.get('target', {}).get('name') == 'privileged':
                  executables.append(item['executable'])
          assert len(executables) == 1, executables
          subprocess.run(['sudo', executables[0], '--ignored', '--test-threads=1'], check=True)
          PYTEST
  sudo-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable native sudo fixture
        run: docker compose -p sudo-relay-gate-ci -f security-lab/sudo-prototype/compose.yaml build
      - name: Verify approval gate and native sudo behavior
        run: docker compose -p sudo-relay-gate-ci -f security-lab/sudo-prototype/compose.yaml run --rm --no-deps prototype
      - name: Remove disposable runtime
        if: always()
        run: docker compose -p sudo-relay-gate-ci -f security-lab/sudo-prototype/compose.yaml down --volumes --remove-orphans

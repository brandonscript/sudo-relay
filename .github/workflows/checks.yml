name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  enrollment-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p enrollment-check -f security-lab/fixture/compose.yaml build
      - name: Check enrollment without starting an execution service
        run: docker compose -p enrollment-check -f security-lab/fixture/compose.yaml run --rm --no-deps -T --entrypoint python sandbox /fixture/test_enrollment.py
      - if: always()
        run: docker compose -p enrollment-check -f security-lab/fixture/compose.yaml down --volumes --remove-orphans
  approval-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: ui
      - run: npm ci && npm run check
        working-directory: security-lab/approval-host
      - run: npx playwright install --with-deps chromium
        working-directory: security-lab/approval-host
      - run: npm test
        working-directory: security-lab/approval-host
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --features host-probe,native-receipt-lab -- -D warnings
      - run: cargo test --locked --features host-probe,native-receipt-lab
      - name: Check native review protocol bridge without authentication or execution
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: sh security-lab/native-protocol/check.sh
      - name: Check isolated Touch ID experiment without hardware authentication
        if: runner.os == 'macOS'
        run: swift test -Xswiftc -warnings-as-errors
        working-directory: security-lab/touch-id
      - name: Check receipt-only XPC peer identities
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: python3 security-lab/xpc-peer/check.py
      - run: npm ci && npm run check && npm test && npm run build
        working-directory: ui
      - run: cargo build --locked --features host-probe --bin mcp-host-probe
      - run: python3 security-lab/mcp-host-probe/check.py
      - run: python3 security-lab/mcp-host-probe/package.py
      - name: Check four isolated MCP target connections without execution
        timeout-minutes: 2
        run: |
          cargo build --locked --bin mcp-server
          python3 security-lab/multi-target/check.py
      - run: node --import ./ui/node_modules/tsx/dist/loader.mjs scripts/integration.mts --boundary-only
      - run: node --import ./ui/node_modules/tsx/dist/loader.mjs scripts/integration.mts
  privileged:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --features native-receipt-lab --test privileged --no-run --message-format=json > /tmp/privileged-test-build.json
      - name: Build the headless native reviewer for the disposable account
        if: runner.os == 'macOS'
        run: sh security-lab/native-protocol/build-protected-check.sh "$RUNNER_TEMP/native-receipt-check"
      - name: Run only the built root test executable
        run: |
          python3 - <<'PYTEST'
          import json, os, subprocess, sys
          executables = []
          for line in open('/tmp/privileged-test-build.json'):
              item = json.loads(line)
              if item.get('executable') and item.get('target', {}).get('name') == 'privileged':
                  executables.append(item['executable'])
          assert len(executables) == 1, executables
          command = ['sudo']
          if sys.platform == 'darwin':
              command += ['env', 'PE_SWIFT_REVIEW_BINARY=' + os.path.join(os.environ['RUNNER_TEMP'], 'native-receipt-check')]
          subprocess.run(command + [executables[0], '--ignored', '--test-threads=1'], check=True)
          PYTEST

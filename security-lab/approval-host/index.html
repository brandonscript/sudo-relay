<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>sudo-relay approval experiment</title>
<style>
:root{color-scheme:light dark;font:16px/1.5 system-ui}*{box-sizing:border-box}body{max-width:720px;margin:40px auto;padding:0 20px}h1{font-size:1.5rem}h2{font-size:1.2rem}p{margin:.65rem 0}.muted{opacity:.7}.card{border:1px solid #8886;border-radius:18px;padding:24px;margin:24px 0}pre{padding:16px;border-radius:10px;background:#8882;white-space:pre-wrap;overflow-wrap:anywhere}button,input{font:inherit;min-height:44px}button{padding:10px 18px;border:1px solid #8888;border-radius:10px;cursor:pointer}button:disabled{cursor:default;opacity:.5}input[type=text]{width:100px;padding:8px 12px;letter-spacing:.3em;font:1.4rem monospace;border:1px solid #8888;border-radius:10px}input[type=checkbox]{min-height:24px;width:20px;vertical-align:middle}label{display:block;margin:12px 0}#challenge{font:700 1.5rem monospace}#message{min-height:48px;overflow-wrap:anywhere}#receipt{overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}details{margin:18px 0}#warning{border-left:3px solid #c88924;padding-left:14px}[hidden]{display:none!important}@media(max-width:480px){body{margin:20px auto}.card{padding:16px}}
</style></head><body>
<h1>Approval experiment</h1>
<p>Nothing runs here. Approval creates a test receipt, without connecting to sudo or the broker.</p>
<p id="mode" class="muted"></p><p id="warning"></p>
<div id="setup-actions" class="actions" hidden><button id="enroll" type="button" disabled>Set up test passkey</button><button id="new" type="button" disabled>New test request</button></div>
<section id="request" class="card" hidden aria-labelledby="title">
<h2 id="title">Review test command</h2><p id="machine" class="muted"></p><p id="reason"></p>
<pre><code id="command"></code></pre><p id="expiry" class="muted"></p>
<details><summary>Execution details</summary><p>Working directory: <code>/</code>. No environment overrides. Execution is disabled.</p><p id="request-id"></p></details>
<form id="approval">
<label><input type="checkbox" id="share"> Share command output with the agent</label>
<p class="muted">This records your choice; the experiment produces no command output.</p>
<label for="number">Enter <strong id="challenge"></strong> to approve</label>
<input id="number" type="text" inputmode="numeric" pattern="[0-9]{2}" maxlength="2" autocomplete="off" aria-label="Confirmation number" required>
<div class="actions"><button id="approve" type="submit">Approve once</button><button id="deny" type="button">Deny</button></div>
</form></section>
<p id="message" role="status" aria-live="polite"></p><p id="receipt" class="muted"></p>
<script type="module" src="/client.js"></script></body></html>

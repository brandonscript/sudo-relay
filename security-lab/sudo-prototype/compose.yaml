services:
  prototype:
    build:
      context: ../..
      dockerfile: security-lab/sudo-prototype/Dockerfile
    network_mode: none
    hostname: sudo-prototype
    extra_hosts: ["sudo-prototype:127.0.0.1"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, KILL, AUDIT_WRITE]
    # Real setuid sudo is the subject of this test; no-new-privileges would disable it.
    pids_limit: 64
    mem_limit: 128m
    cpus: 1
    tmpfs:
      - /lab:rw,nosuid,nodev,noexec,size=16m,mode=0755
      - /tmp:rw,nosuid,nodev,noexec,size=8m,mode=1777
      - /etc/sudoers.d:rw,nosuid,nodev,noexec,size=1m,mode=0755
      - /run:rw,nosuid,nodev,noexec,size=2m,mode=0755
